server {
    server_name provex.provaliantgroup.com;
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/letsencrypt/live/provex.provaliantgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/provex.provaliantgroup.com/privkey.pem;

    # Auth endpoints - strip /api prefix
    location /api/auth/ {
        proxy_pass http://localhost:8010/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        client_max_body_size 5M;
    }

    # All API endpoints - strip /api prefix
    location /api/ {
        rewrite ^/api(.*) $1 break;
        proxy_pass http://localhost:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5M;
    }

    # Uploaded files served by backend
    location /uploads {
        proxy_pass http://localhost:8010/uploads;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Swagger docs
    location /docs {
        proxy_pass http://localhost:8010/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://localhost:8010/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Everything else goes to frontend (Next.js)
    location / {
        proxy_pass http://localhost:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}