services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8010:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env
    restart: unless-stopped
    networks:
      - provex-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8090:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8010
    restart: unless-stopped
    networks:
      - provex-network

networks:
  provex-network:
    driver: bridge