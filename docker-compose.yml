services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/.env:/app/.env
      - ./backend/reimburseeasy.db:/app/reimburseeasy.db
    restart: unless-stopped
    networks:
      - provex-network

  frontend:
    image: provex-frontend:node22.23.4-20261027
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8090:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
    restart: unless-stopped
    networks:
      - provex-network

networks:
  provex-network:
    driver: bridge